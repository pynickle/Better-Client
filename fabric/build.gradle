plugins {
    id "com.gradleup.shadow" version "9.4.0"
}

def commonAccessWidener = project(':common').file("src/main/resources/${mod_id}.accesswidener")

architectury {
    platformSetupLoomIde()
    fabric()
}

sourceSets.main.resources { srcDir project(':common').file('src/generated/resources').getAbsolutePath() }

loom {
    accessWidenerPath = commonAccessWidener
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    maven {
        // Mod Menu
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.architectury.minecraft}"

    api "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    api "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    implementation "dev.isxander:yet-another-config-lib:${yacl_version}+26.3-fabric"

    implementation "com.github.ramixin:mixson-fabric:${mixson_version}"

    implementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

    include "com.github.ramixin:mixson-fabric:${mixson_version}"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    inputs.property 'version', project.version

    from(commonAccessWidener)

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    archiveClassifier = "raw"
}

java {
    withSourcesJar()
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    exclude "${mod_id}.accesswidener"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    from rootProject.file("LICENSE.md")
}

loom.injectAccessWidener(tasks.named('shadowJar'), commonAccessWidener)
